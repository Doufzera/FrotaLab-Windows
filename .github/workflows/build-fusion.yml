name: Build FrotaFusion Windows
on:
  push:
    branches: [main]
    paths:
      - 'fusion_core.py'
      - 'fusion_gui.py'
      - 'tests/test_fusion.py'
      - '.github/workflows/build-fusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar Python
        run: python -m py_compile fusion_core.py fusion_gui.py
      - name: Testar fusao e deduplicacao
        run: python -m unittest discover -s tests -p 'test_fusion.py' -v
      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Compilar FrotaFusion.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FrotaFusion fusion_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: FrotaFusion-Windows
          path: dist/FrotaFusion.exe
          if-no-files-found: error
